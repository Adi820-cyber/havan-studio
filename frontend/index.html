<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/h1_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacred Invitations for Your Gatherings</title>
    <meta name="description" content="Create beautiful, interactive invitations for your mehfils, weddings, birthdays, and celebrations. Share one link, collect RSVPs, and keep details private until guests respond." />
    
    <!-- Security Header Policies -->
    <!-- CSP delivered via HTTP headers (vercel.json / backend security middleware) is
         the enforced policy. This <meta> tag is a defense-in-depth fallback —
         frame-ancestors and upgrade-insecure-requests stay on the HTTPS response
         header so local Vite development remains on localhost. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://vercel.live; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data: blob: https:; connect-src 'self' https://vercel.live wss://vercel.live ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'; script-src-attr 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Google Fonts & Fontshare for havan visual direction -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;700&family=Unbounded:wght@300;500;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
