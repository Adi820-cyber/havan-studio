name: Havan Studio CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Native Node.js)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Workspace Dependencies (Backend & Frontend)
        run: |
          cd backend && npm ci || npm install
          cd ../frontend && npm ci || npm install
          cd ..

      - name: Run Static Code Verification
        run: npm run verify

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
          cd ..
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:3000' }}

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
