services:
  - type: web
    name: havan-studio
    runtime: node
    # --include=dev is required: vite and @vitejs/plugin-react are devDependencies
    # and Render sets NODE_ENV=production, which would otherwise skip them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production

      # Vite inlines VITE_* variables at BUILD time, not at run time. These must
      # be present when `npm run build` executes or the bundle ships without a
      # Supabase configuration and the app throws on load.
      #
      # sync: false means "prompt me in the dashboard" — the values are not
      # committed to this file.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

# No `disk:` block is needed any more, and that is the point. This service holds
# no application state: users, events, RSVPs and comments live in Supabase
# Postgres. Previously the app wrote to data/database.json on an ephemeral
# filesystem, so every deploy silently reverted the database to whatever
# snapshot was last committed to git.
#
# Before the first deploy, also add your Render URL to the Supabase project's
# allowed redirect URLs (Dashboard → Authentication → URL Configuration), and
# set site_url in supabase/config.toml accordingly.
